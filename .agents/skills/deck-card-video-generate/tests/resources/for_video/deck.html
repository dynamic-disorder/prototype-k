<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lists to cards — deck fixture</title>
<style>
  :root { --paper:#f5f3ee; --ink:#191a1b; --accent:#12544a; --line:#ddd7ca; }
  * { box-sizing:border-box }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif }
  .stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center }
  .frame { height:76vh; aspect-ratio:2/3; background:#fff; border:1px solid var(--line);
    box-shadow:0 18px 60px rgba(25,26,27,.10); display:flex; align-items:center; justify-content:center; padding:10px }
  .frame img { width:100%; height:100%; object-fit:contain }
  .label { position:fixed; left:64px; bottom:52px; font:600 18px/1.4 ui-monospace, Consolas, monospace;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent) }
  .dots { position:fixed; right:64px; bottom:52px; display:flex; gap:9px }
  .dot { width:9px; height:9px; border-radius:50%; border:1px solid var(--accent) }
  .dot.on { background:var(--accent) }
</style>
</head>
<body>
  <div class="stage"><div class="frame"><img id="slide" alt=""></div></div>
  <div class="label" id="label"></div>
  <div class="dots" id="dots"></div>
  <script>
    const slides = [
      ['00.webp', 'A list'],
      ['01.webp', 'Cards'],
      ['10.webp', 'Another list'],
      ['11.webp', 'More cards'],
      ['20.webp', 'Still a list'],
      ['21.webp', 'Big card'],
    ];
    const img = document.getElementById('slide');
    const label = document.getElementById('label');
    const dots = document.getElementById('dots');
    for (let i = 0; i < slides.length; i += 1) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dots.appendChild(dot);
    }
    window.showSlide = (index) => new Promise((resolve) => {
      const [src, text] = slides[index];
      label.textContent = text;
      [...dots.children].forEach((dot, i) => dot.classList.toggle('on', i === index));
      if (img.getAttribute('src') === src && img.complete) {
        resolve(true);
        return;
      }
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = src;
    });
    window.showSlide(0);
  </script>
</body>
</html>
