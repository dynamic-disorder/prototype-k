# DSH model tiers — the one tracked source for the profile patch layer.
#
# `scripts/install-dsh.mjs` merges the entries below into the running profile's patch file
# (`~/.dsh/profiles/<profile>/cordis.patch.yml`). Edit this file, never the copy in $HOME, so
# both machines are rendered from one source and `--check` can prove they agree.
#
# Tokens the installer resolves before merging:
#   {{localModels}}   `localModels` below, filtered to what `ollama list` actually reports
#
# Ownership: entries are matched and replaced by `id`. Every other entry in the patch file — the
# `ui-*` rows the desktop app writes when a setting changes — is left byte-identical, because the
# app rewrites this file through a comment-preserving YAML AST and owns only the entry it edits.
#
# Nothing machine-specific belongs in this file. The Ollama endpoint is loopback on both machines;
# the model store path is a per-machine service setting, documented in the machine notes. The
# context window the harness may assume is declared here, because the harness has no other way to
# learn it and would otherwise budget a prompt far past what the server can hold.

# The local tier the model picker offers, in the order it should be tried. A model listed here but
# not installed is simply not declared — declaring it would put a row in the picker that answers 404.
localModels:
  - qwen3.8:27b
  - gemma4:12b
  - qwen3.5:9b

# The window stamped on every local model above. It is a bound, not the service setting: it must not
# exceed the machine's OLLAMA_CONTEXT_LENGTH, or the harness sends a prompt the server truncates and
# the loss is silent. Under-stating costs budget; over-stating loses text. A machine that runs a
# different bound sets DSH_LOCAL_CONTEXT_WINDOW, and the renderer uses it instead.
localContextWindow: 16384

patches:
  # The providers map is declared in FULL, so the entry is a complete statement of what the picker
  # offers. Adding a provider in the app's settings UI therefore has to be mirrored here, or the
  # next --write removes it — which is what --check is for.
  #
  # `apiKeyEnv` names a variable, never holds the key: the value lives in the machine's own
  # environment and is never committed.
  - id: llm-pi-ai
    name: "@deepseek-ai/dsh-llm-pi-ai"
    config:
      providers:
        openrouter:
          apiKeyEnv: OPENROUTER_API_KEY
          models:
            - id: deepseek/deepseek-chat
              name: deepseek/deepseek-chat
        ollama:
          displayName: Ollama
          apiKeyEnv: OLLAMA_LOCAL_KEY
          api: openai-completions
          baseURL: http://127.0.0.1:11434/v1
          models: "{{localModels}}"

  # The session default. On 2026-11-15 the owner made the local 27B the default and this template
  # mirrors it, so a fresh session starts on the machine at no per-turn cost. The trade is on
  # record: that model did not hold its task in a long-preamble first turn (see the subagent gate
  # note below), so a session that needs close reading should switch to a cloud tier first.
  # `reasoningEffort` is left out because it is a cloud-tier knob and the app writes none for a
  # local route. The model must be pulled on any machine that renders this; the installer stops
  # instead of writing a default that answers 404.
  - id: agent-default-model
    name: "@deepseek-ai/dsh-agent-default-model"
    config:
      provider: ollama
      model: qwen3.8:27b

  # Subagent delegation is refused until this entry authorizes a route: with no policy recorded, a
  # child may only reuse the parent's own route. The shipped default is `enabled: false`, which is
  # why an authorized local model is not enough on its own — the route list is the permission.
  #
  # No local route is listed. All three tiered models passed the raw tool-call and second-turn
  # criteria on 2026-11-15, but failed criterion 3: a local child's first turn does not receive its
  # task, so it answers with "I don't see a task yet" and edits nothing until a second message
  # arrives. Cloud children pass the same test in the same conditions, so the fault is in this
  # harness build's local path, not in the models. Re-run the gate before adding a route back;
  # the evidence is under local_user_files/gates/2026-11-15/.
  - id: subagent-model-selection-settings
    config:
      enabled: true
      allowedModels:
        - provider: deepseek-official
          model: deepseek-flash
        - provider: deepseek-official
          model: deepseek-v4-pro
