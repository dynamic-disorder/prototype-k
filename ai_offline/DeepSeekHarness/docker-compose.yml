services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepseek-harness:local
    container_name: deepseek-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ${OLLAMA_MODELS_PATH}:/root/.ollama/models
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_HOST: 0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - deepseek

  deepseek-pull:
    image: ollama/ollama:latest
    container_name: deepseek-pull
    entrypoint: ["ollama"]
    command: ["pull", "${DEEPSEEK_MODEL:-deepseek-r1:8b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
      - ${OLLAMA_MODELS_PATH}:/root/.ollama/models
    profiles:
      - setup
    networks:
      - deepseek

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: deepseek-webui
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - deepseek

networks:
  deepseek:
    driver: bridge

volumes:
  ollama_data:
  open_webui_data: